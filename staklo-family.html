    <div class="detail-copy">
      <section class="lore-section"><h2 data-i18n="familyProjectTitle">家族機密項目</h2><p data-i18n="familyProjectBody">斯塔庫洛家族投入最多時間與金錢的最高機密項目是《尋》計劃。其目的是追獵「零號實驗體」卡莉・菲利奇塔的靈魂，並掌握可能與其相關的神級力量。</p></section>
      <section class="lore-section"><h2 data-i18n="familyAccessTitle">宇宙跳躍權限</h2><p data-i18n="familyAccessBody">宇宙跳躍成本高昂，只有斯塔庫洛家族或其指定成員能使用。相關人員通常將指定座標設置為家族內部的實驗樓。</p></section>
